name: Build and deploy WasmBolt

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Check out the matching LLVM driver sources
        uses: actions/checkout@v6
        with:
          repository: llvm/llvm-project
          ref: llvmorg-23.1.0
          path: llvm-project
          sparse-checkout: |
            llvm/tools/llc

      - name: Install the Emscripten build environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment-wasm-build.yml
          environment-name: wasmbolt-wasm-build
          init-shell: bash

      - name: Install the WebAssembly LLVM target packages
        shell: bash -l {0}
        run: |
          micromamba create -y \
            -n wasmbolt-wasm-host \
            -f environment-wasm-host.yml \
            --platform=emscripten-wasm32

      - name: Build WasmBolt
        shell: bash -l {0}
        run: |
          set -euo pipefail
          export LLVM_WASM_PREFIX="${MAMBA_ROOT_PREFIX}/envs/wasmbolt-wasm-host"
          export EMSCRIPTEN_SYSROOT="${CONDA_PREFIX}/opt/emsdk/upstream/emscripten/cache/sysroot"
          export CLANG_RESOURCE_TREE="${LLVM_WASM_PREFIX}/lib/clang/23"
          export LLVM_SOURCE_TREE="${GITHUB_WORKSPACE}/llvm-project"
          bash scripts/build.sh

      - name: Verify deployment artifacts
        shell: bash -l {0}
        run: |
          set -euo pipefail
          test -s site/index.html
          test -s site/app.js
          test -s site/Compiler.js
          test -s site/Compiler.wasm
          test -s site/Compiler.data
          test -s site/WasmBoltMlirOpt.so
          grep -q 'WasmBolt' site/index.html
          du -h site/Compiler.js site/Compiler.wasm site/Compiler.data \
            site/WasmBoltMlirOpt.so
          core_data_size="$(stat -c '%s' site/Compiler.data)"
          if (( core_data_size > 50 * 1024 * 1024 )); then
            echo "Compiler.data exceeded the 50 MiB core-runtime budget" >&2
            exit 1
          fi
          if grep -q 'WasmBoltMlirOpt.so' site/Compiler.js; then
            echo "The MLIR driver was accidentally added back to the core preload" >&2
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
