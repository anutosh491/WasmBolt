[build-system]
requires = [
    "hatchling>=1.27.0",
    "hatch-nodejs-version>=0.3.2",
    "jupyter-builder>=1.2.0,<2",
]
build-backend = "hatchling.build"

[project]
name = "wasmbolt"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Framework :: Jupyter :: JupyterLab :: 4",
    "Framework :: Jupyter :: JupyterLab :: Extensions",
    "Framework :: Jupyter :: JupyterLab :: Extensions :: Prebuilt",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Compilers",
]
dependencies = [
]
dynamic = ["version", "description", "authors", "urls", "keywords"]

[project.scripts]
wasmbolt = "wasmbolt.server:main"

[project.optional-dependencies]
dev = [
    "jupyterlab>=4.6,<5",
    "jupyter-builder>=1.2.0",
]

[tool.hatch.version]
source = "nodejs"

[tool.hatch.metadata.hooks.nodejs]
fields = ["description", "authors", "urls", "keywords"]

[tool.hatch.build.targets.sdist]
# Twine 6.2 and the publishing action validate core metadata through 2.4.
core-metadata-version = "2.4"
artifacts = ["wasmbolt/labextension", "wasmbolt/site"]
exclude = [".github", "binder", "*.tgz"]

[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"
ignore-vcs = true
exclude = ["wasmbolt/labextension/**"]

[tool.hatch.build.targets.wheel.shared-data]
"wasmbolt/labextension" = "share/jupyter/labextensions/wasmbolt"
"install.json" = "share/jupyter/labextensions/wasmbolt/install.json"

[tool.hatch.build.hooks.version]
path = "wasmbolt/_version.py"

[tool.hatch.build.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder>=0.5"]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = [
    "wasmbolt/site/routes.json",
    "wasmbolt/labextension/static/style.js",
    "wasmbolt/labextension/package.json",
    "wasmbolt/labextension/static/compiler/manifest.json",
    "wasmbolt/labextension/static/compiler/worker.js",
    "wasmbolt/labextension/static/compiler/utility-worker.js",
    "wasmbolt/labextension/static/compiler/tool-worker.js",
    "wasmbolt/labextension/static/compiler/clangd-worker.js",
    "wasmbolt/labextension/static/compiler/debug-worker.js",
    "wasmbolt/labextension/static/compiler/Compiler.js",
    "wasmbolt/labextension/static/compiler/Compiler.wasm",
    "wasmbolt/labextension/static/compiler/Compiler.data",
    "wasmbolt/labextension/static/compiler/llvm/llvm.js",
    "wasmbolt/labextension/static/compiler/llvm/llvm.wasm",
    "wasmbolt/labextension/static/compiler/licenses/LLVM.txt",
    "wasmbolt/labextension/static/compiler/licenses/WasmBolt.txt",
    "wasmbolt/labextension/static/compiler/licenses/Emscripten.txt",
    "wasmbolt/labextension/static/compiler/licenses/graphviz.txt",
    "wasmbolt/labextension/static/compiler/licenses/libwebp.txt",
    "wasmbolt/labextension/static/compiler/licenses/xtensor.txt",
    "wasmbolt/labextension/static/compiler/licenses/xtl.txt",
    "wasmbolt/labextension/static/compiler/licenses/zlib.txt",
]
skip-if-exists = [
    "wasmbolt/site/routes.json",
    "wasmbolt/labextension/static/compiler/manifest.json",
    "wasmbolt/labextension/static/compiler/worker.js",
    "wasmbolt/labextension/static/compiler/utility-worker.js",
    "wasmbolt/labextension/static/compiler/tool-worker.js",
    "wasmbolt/labextension/static/compiler/clangd-worker.js",
    "wasmbolt/labextension/static/compiler/debug-worker.js",
    "wasmbolt/labextension/static/compiler/Compiler.js",
    "wasmbolt/labextension/static/compiler/Compiler.wasm",
    "wasmbolt/labextension/static/compiler/Compiler.data",
    "wasmbolt/labextension/static/compiler/llvm/llvm.js",
    "wasmbolt/labextension/static/compiler/llvm/llvm.wasm",
]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
build_cmd = "build:package"
npm = ["jlpm"]

[tool.hatch.build.hooks.jupyter-builder.editable-build-kwargs]
build_cmd = "install:extension"
npm = ["jlpm"]
source_dir = "src"
build_dir = "wasmbolt/labextension"

[tool.check-wheel-contents]
ignore = ["W002"]
