name: Publish Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      destination:
        description: Registry to publish to; none only builds and validates
        required: true
        default: none
        type: choice
        options:
          - none
          - pypi
          - npm
          - both

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require the existing stable release tag
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re

          with open('package.json') as file:
              package = json.load(file)
          version = package['version']
          assert re.fullmatch(r'\d+\.\d+\.\d+', version), version
          assert package['name'] == 'fortitudo'
          assert os.environ['RELEASE_REF'] == f'refs/tags/v{version}', (
              f'Run this workflow from the existing v{version} tag.'
          )
          PY

  build:
    needs: release
    # GitHub validates permissions even for the skipped Pages job.
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/build.yml
    with:
      release: true

  pypi:
    needs: build
    if: >-
      github.event_name == 'release' || inputs.destination == 'pypi' ||
      inputs.destination == 'both'
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/fortitudo/
    permissions:
      contents: read
      id-token: write
    steps:
      # actions/download-artifact@v8.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: python-distributions
          path: dist
      - name: Publish to PyPI with trusted publishing
        # pypa/gh-action-pypi-publish@release/v1
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: dist/

  npm:
    needs: build
    if: >-
      github.event_name == 'release' || inputs.destination == 'npm' ||
      inputs.destination == 'both'
    runs-on: ubuntu-24.04
    environment:
      name: npm
      url: https://www.npmjs.com/package/fortitudo
    permissions:
      contents: read
      id-token: write
    steps:
      # actions/download-artifact@v8.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: npm-distribution
          path: dist
      # actions/setup-node@v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Publish to npm with trusted publishing
        run: |
          npm --version
          npm publish ./dist/fortitudo.tgz --access public --tag latest \
            --ignore-scripts --registry https://registry.npmjs.org
